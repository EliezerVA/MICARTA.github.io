<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mi carta</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;

            overflow: hidden;
        }


        body {

            background: #fff5fa;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        /* =========================
           GIF INICIAL
           ========================= */

        #gif {

            width: 300px;

            cursor: pointer;

            position: relative;

            z-index: 1;

            user-select: none;
        }


        /* =========================
           CONTENEDOR DE CORAZONES
           ========================= */

        #heart-container {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            pointer-events: none;

            z-index: 100;
        }


        /* =========================
           CORAZONES
           ========================= */

        .heart {

            position: absolute;

            top: -120px;

            color: #f7a8c4;

            line-height: 0.8;

            font-size: var(--size);

            animation:
                caer var(--duration) linear forwards;

            filter:
                drop-shadow(
                    0 3px 4px rgba(0, 0, 0, 0.08)
                );
        }


        @keyframes caer {

            0% {

                transform:
                    translateY(-150px)
                    rotate(var(--rotation));
            }

            100% {

                transform:
                    translateY(var(--final-y))
                    rotate(var(--rotation));
            }

        }


        /* =========================
           DESAPARECER
           ========================= */

        #heart-container.fade-out,
        #gif.fade-out {

            animation:
                desaparecer 1.5s ease forwards;
        }


        @keyframes desaparecer {

            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }

        }


        /* =========================
           ESCENA FINAL
           ========================= */

        #escena-final {

            position: fixed;

            z-index: 200;

            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 3vw;

            padding: 20px 30px;

            opacity: 1;

            pointer-events: none;
        }


        /* =========================
           CARTA FINAL
           ========================= */

        #carta-final {

            display: block;

            width: auto;
            height: auto;

            max-width: 55vw;
            max-height: 90vh;

            object-fit: contain;

            opacity: 0;

            transform: scale(0.05);

            flex-shrink: 1;
        }


        /*
         * La carta crece desde pequeña
         */

        #carta-final.aparecer {

            animation:

                crecer-carta 1.5s
                cubic-bezier(0.16, 1, 0.3, 1)
                forwards;
        }


        @keyframes crecer-carta {

            0% {

                opacity: 0;

                transform:
                    scale(0.05);
            }

            20% {

                opacity: 1;
            }

            100% {

                opacity: 1;

                transform:
                    scale(1);
            }

        }


        /* =========================
           GIF 1 Y GIF 2
           ========================= */

        .gif-final {

            width: 18vw;

            max-width: 220px;

            max-height: 35vh;

            object-fit: contain;

            flex-shrink: 1;
        }


        #gif1-final,
        #gif2-final {

            opacity: 0;

            animation:
                aparecer-gif 1s ease forwards;

            animation-delay: 0.2s;
        }


        @keyframes aparecer-gif {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }


        /* ==================================================
           MÓVIL
           ================================================== */

        @media (max-width: 700px) {

            #escena-final {

                flex-direction: column;

                gap: 10px;

                padding: 15px;

                justify-content: center;

                align-items: center;

                overflow-y: auto;
            }


            /*
             * GIF 1 arriba
             */

            #gif1-final {

                order: 1;

                width: auto;

                max-width: 45vw;

                max-height: 18vh;
            }


            /*
             * CARTA en medio
             */

            #carta-final {

                order: 2;

                max-width: 88vw;

                max-height: 60vh;
            }


            /*
             * GIF 2 abajo
             */

            #gif2-final {

                order: 3;

                width: auto;

                max-width: 45vw;

                max-height: 18vh;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         GIF INICIAL
         ========================= -->

    <img
        id="gif"
        src="carta.gif"
        alt="Carta">


    <!-- =========================
         MÚSICA
         ========================= -->

    <audio
        id="musica"
        preload="auto">

        <source
            src="mitodo.mp3"
            type="audio/mpeg">

    </audio>


    <!-- =========================
         CORAZONES
         ========================= -->

    <div id="heart-container"></div>


    <!-- =========================
         ESCENA FINAL
         ========================= -->

    <div id="escena-final">


        <!-- GIF 1 -->

        <img
            id="gif1-final"
            class="gif-final"
            src="gif1.gif"
            alt="GIF 1">


        <!-- CARTA -->

        <img
            id="carta-final"
            src="cart.png"
            alt="Carta final">


        <!-- GIF 2 -->

        <img
            id="gif2-final"
            class="gif-final"
            src="gif2.gif"
            alt="GIF 2">


    </div>


    <script>


        const gif =
            document.getElementById("gif");


        const container =
            document.getElementById("heart-container");


        const musica =
            document.getElementById("musica");


        const escenaFinal =
            document.getElementById("escena-final");


        const cartaFinal =
            document.getElementById("carta-final");


        const gif1Final =
            document.getElementById("gif1-final");


        const gif2Final =
            document.getElementById("gif2-final");


        let animando = false;


        /*
         * =========================
         * ESCONDER ESCENA FINAL
         * =========================
         */

        escenaFinal.style.display = "none";


        /*
         * =========================
         * MÚSICA EN BUCLE
         * =========================
         *
         * Cuando el MP3 termina,
         * vuelve automáticamente al inicio.
         */

        musica.addEventListener("ended", () => {

            musica.currentTime = 0;

            musica.play().catch(error => {

                console.log(
                    "No se pudo reiniciar la música:",
                    error
                );

            });

        });


        /*
         * =========================
         * CLIC EN EL GIF
         * =========================
         */

        gif.addEventListener("click", () => {


            if (animando) return;


            animando = true;


            /*
             * =========================
             * REPRODUCIR MÚSICA
             * =========================
             */

            musica.currentTime = 0;

            musica.play().catch(error => {

                console.log(
                    "No se pudo reproducir la música:",
                    error
                );

            });


            /*
             * =========================
             * CREAR CORAZONES
             * =========================
             */

            const cantidad = 420;


            for (let i = 0; i < cantidad; i++) {


                const heart =
                    document.createElement("div");


                heart.className = "heart";


                heart.innerHTML = "♥";


                /*
                 * POSICIÓN HORIZONTAL
                 */

                heart.style.left =
                    (Math.random() * 105 - 2)
                    + "%";


                /*
                 * TAMAÑO
                 */

                const size =
                    55 + Math.random() * 40;


                heart.style.setProperty(
                    "--size",
                    size + "px"
                );


                /*
                 * ROTACIÓN
                 */

                heart.style.setProperty(
                    "--rotation",
                    (-25 + Math.random() * 50)
                    + "deg"
                );


                /*
                 * POSICIÓN FINAL
                 */

                heart.style.setProperty(
                    "--final-y",
                    Math.random() *
                    (window.innerHeight + 150)
                    + "px"
                );


                /*
                 * VELOCIDAD
                 */

                heart.style.setProperty(
                    "--duration",
                    (2 + Math.random() * 4)
                    + "s"
                );


                /*
                 * RETRASO
                 */

                heart.style.animationDelay =
                    Math.random() * 1.8
                    + "s";


                container.appendChild(heart);

            }


            /*
             * =========================
             * DESPUÉS DE 10 SEGUNDOS
             * =========================
             */

            setTimeout(() => {


                /*
                 * DESAPARECEN CORAZONES
                 */

                container.classList.add(
                    "fade-out"
                );


                /*
                 * DESAPARECE GIF INICIAL
                 */

                gif.classList.add(
                    "fade-out"
                );


                /*
                 * =========================
                 * ESPERAR 3 SEGUNDOS
                 * =========================
                 *
                 * 1.5 segundos de desaparición
                 * + 3 segundos de espera.
                 */

                setTimeout(() => {


                    /*
                     * ELIMINAR GIF INICIAL
                     */

                    gif.remove();


                    /*
                     * ELIMINAR CORAZONES
                     */

                    container.remove();


                    /*
                     * =========================
                     * FONDO BLANCO
                     * =========================
                     */

                    document.body.style.background =
                        "white";


                    /*
                     * =========================
                     * MOSTRAR ESCENA FINAL
                     * =========================
                     */

                    escenaFinal.style.display =
                        "flex";


                    /*
                     * INICIAR ANIMACIÓN
                     * DE LA CARTA
                     */

                    cartaFinal.classList.add(
                        "aparecer"
                    );


                }, 4500);


            }, 10000);

        });


        /*
         * =========================
         * AJUSTAR CARTA
         * =========================
         */

        function ajustarCarta() {


            const margen = 40;


            const anchoMax =
                window.innerWidth - margen;


            const altoMax =
                window.innerHeight - margen;


            /*
             * PC
             */

            if (window.innerWidth > 700) {

                cartaFinal.style.maxWidth =
                    Math.min(
                        anchoMax * 0.55,
                        900
                    ) + "px";


                cartaFinal.style.maxHeight =
                    altoMax * 0.90 + "px";

            }


            /*
             * MÓVIL
             */

            else {

                cartaFinal.style.maxWidth =
                    anchoMax * 0.88 + "px";


                cartaFinal.style.maxHeight =
                    altoMax * 0.60 + "px";

            }

        }


        /*
         * =========================
         * AJUSTAR CUANDO CARGA
         * =========================
         */

        cartaFinal.addEventListener(
            "load",
            ajustarCarta
        );


        /*
         * =========================
         * AJUSTAR AL CAMBIAR
         * TAMAÑO DE VENTANA
         * =========================
         */

        window.addEventListener(
            "resize",
            ajustarCarta
        );


        ajustarCarta();


    </script>


</body>

</html>
